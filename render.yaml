services:
  - type: web
    name: kirill's home website
    runtime: static
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
    # Deploy builds are deliberately cheap and side-effect-free:
    # - no content regeneration — committed snapshots (soundcloud.json et
    #   al.) ship exactly as build:local produced and committed them;
    # - no checksums/drift pipeline — the committed manifest + drift
    #   report (public/, copied into dist/ by vite) are served as-is; the
    #   live-baseline pipeline re-runs where it belongs (CI, build:local).
    # The static gate below fails the deploy before ANY install/build
    # compute when the uploaded build's drift report is missing, corrupt,
    # or reports unresolved violations (verify-policy.mjs needs no
    # node_modules — node builtins only).
    buildCommand: git submodule update --init --recursive && npm run verify:policy && npm install && npm --prefix xp.css install --no-audit --no-fund && npm --prefix xp.css run build && npm run build
    staticPublishPath: ./dist
    routes:
      - type: redirect
        source: /404
        destination: /404.html

# Domain redirect configuration for pagerts.akinevz.com -> akinevz.com/pagerts
# Note: To enable this redirect:
# 1. Add pagerts.akinevz.com as a Custom Domain in Render Dashboard
#    (Go to Service → Settings → Custom Domains → Add Domain)
# 2. Configure DNS CNAME record:
#    pagerts.akinevz.com → CNAME → <your-render-service>.onrender.com
# 3. The redirect path /pagerts is handled by this website's routing
#
# Alternative: Use URL-redirect service record at the registry level:
# Add SRV record: _url-redirect._tcp.pagerts.akinevz.com → redirect to https://akinevz.com/pagerts

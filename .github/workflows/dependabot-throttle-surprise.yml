name: Dependabot Throttle Surprise

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  throttle:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close overflow Dependabot PRs
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentPr = context.payload.pull_request.number;
            const maxOpen = 2;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const openDependabot = pulls.filter(
              (pr) => pr.user && pr.user.login === 'dependabot[bot]'
            );

            if (openDependabot.length <= maxOpen) {
              core.info(`Dependabot open PRs: ${openDependabot.length}/${maxOpen}. No throttle needed.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: currentPr,
              body:
                'Bot surprise: this repo enforces a cooldown when too many Dependabot PRs are open. ' +
                'This PR was auto-closed to keep maintenance human-sized. Retry next cycle.',
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: currentPr,
              state: 'closed',
            });

            core.info(`Closed PR #${currentPr} because open Dependabot PRs exceeded ${maxOpen}.`);
name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build xp.css (submodule, dist is gitignored)
        run: npm --prefix xp.css install --no-audit --no-fund && npm --prefix xp.css run build

      - name: Verify lockfile STABLE
        run: git diff --exit-code package-lock.json

      - name: Build site
        run: npm run build

      - name: Verify drift policy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run verify:policy -- --nonblocking
          else
            npm run verify:policy
          fi

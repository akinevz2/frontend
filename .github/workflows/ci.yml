name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify lockfile unchanged
        run: git diff --exit-code package-lock.json

      - name: Build site
        run: npm run build

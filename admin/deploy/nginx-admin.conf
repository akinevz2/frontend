# ── nginx reverse proxy for WS-VISION ──────────────────────────────────
# Place at /etc/nginx/sites-available/admin and symlink to sites-enabled.
# Optional — the .NET app already serves HTTPS directly with a self-signed cert.
# Use nginx only if you want to proxy through a different port or add TLS
# termination with a real CA cert.  In most cases you can skip nginx entirely.
#
# If using nginx, comment out the Kestrel HTTPS config in Program.cs and set
# UseHttps=false in admin.env, then configure TLS here.

# Redirect HTTP → HTTPS
server {
    listen 8080;
    server_name ws-vision;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name ws-vision;

    # If you have a real CA cert, use it here. Otherwise this is only useful
    # if nginx terminates TLS and the backend runs HTTP.
    # ssl_certificate     /etc/ssl/admin/admin.crt;
    # ssl_certificate_key /etc/ssl/admin/admin.key;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
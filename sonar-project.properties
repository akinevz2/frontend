# SonarQube scan config for the website project.
# Server: the dots llms compose stack (localhost:9000); the token lives in
# ~/dots/shell/.cache/sonarqube.env and is injected via SONAR_TOKEN.
sonar.host.url=http://localhost:9000
sonar.projectKey=website-xp-phone
sonar.projectName=website-xp-phone
sonar.projectVersion=2.5.1
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
sonar.sourceEncoding=UTF-8

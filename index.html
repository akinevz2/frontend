<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="my cozy little personal website"
      data-route-meta="description"
    />
    <link
      rel="canonical"
      href="https://akinevz.com/"
      data-route-meta="canonical"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="akinevz.com" />
    <meta
      property="og:title"
      content="home of kine"
      data-route-meta="og:title"
    />
    <meta
      property="og:description"
      content="my cozy little personal website"
      data-route-meta="og:description"
    />
    <meta
      property="og:url"
      content="https://akinevz.com/"
      data-route-meta="og:url"
    />
    <meta
      property="og:image"
      content="https://akinevz.com/avatar.png"
      data-route-meta="og:image"
    />
    <!-- og:image intrinsic size, read from the real public/avatar.png at
         build (build/meta.ts); the placeholder carries the same values. -->
    <meta
      property="og:image:width"
      content="123"
      data-route-meta="og:image:width"
    />
    <meta
      property="og:image:height"
      content="121"
      data-route-meta="og:image:height"
    />
    <script type="application/ld+json" data-route-meta="jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kirill Nevzorov",
        "url": "https://akinevz.com/",
        "sameAs": [
          "https://github.com/akinevz",
          "https://github.com/akinevz2",
          "https://soundcloud.com/akinevz",
          "https://soundcloud.com/akinevz2",
          "https://www.instagram.com/akinevz2/",
          "https://www.linkedin.com/in/akinevz/",
          "https://www.twitch.tv/akinevz",
          "https://x.com/akinevz"
        ]
      }
    </script>
    <meta
      name="twitter:card"
      content="summary"
      data-route-meta="twitter:card"
    />
    <meta
      name="twitter:image"
      content="https://akinevz.com/avatar.png"
      data-route-meta="twitter:image"
    />
    <meta
      name="twitter:title"
      content="home of kine"
      data-route-meta="twitter:title"
    />
    <meta
      name="twitter:description"
      content="my cozy little personal website"
      data-route-meta="twitter:description"
    />
    <title data-route-meta="title">home of kine</title>
    <style>
      @keyframes clippyEnter {
        0% {
          opacity: 0;
          transform: translateY(100%);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <noscript>
      <link rel="stylesheet" href="/loading.css" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
